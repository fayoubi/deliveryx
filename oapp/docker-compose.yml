version: '3.8'

services:
  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: deliveryx-postgres
    environment:
      POSTGRES_USER: deliveryx
      POSTGRES_PASSWORD: deliveryx_dev_pass
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deliveryx-network

  # RabbitMQ - Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: deliveryx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: deliveryx
      RABBITMQ_DEFAULT_PASS: deliveryx_dev_pass
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deliveryx-network

  # Traefik - API Gateway
  traefik:
    image: traefik:v2.10
    container_name: deliveryx-gateway
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"       # API Gateway
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - deliveryx-network
    depends_on:
      - postgres
      - rabbitmq

  # Restaurant Service
  restaurant-service:
    build:
      context: ./services/restaurant
      dockerfile: Dockerfile
    container_name: deliveryx-restaurant-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: deliveryx
      DB_PASSWORD: deliveryx_dev_pass
      DB_NAME: deliveryx_restaurant
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - deliveryx-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restaurant.rule=PathPrefix(`/api/v1/stores`) || PathPrefix(`/api/v1/locations`)"
      - "traefik.http.routers.restaurant.entrypoints=web"
      - "traefik.http.services.restaurant.loadbalancer.server.port=8081"
      - "traefik.http.routers.restaurant.priority=50"
    restart: unless-stopped

  # Menu Service
  menu-service:
    build:
      context: ./services/menu
      dockerfile: Dockerfile
    container_name: deliveryx-menu
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: deliveryx
      DB_PASSWORD: deliveryx_dev_pass
      DB_NAME: deliveryx_menu
      SERVER_PORT: 8082
      RABBITMQ_URL: amqp://deliveryx:deliveryx_dev_pass@rabbitmq:5672/
    ports:
      - "8082:8082"
    networks:
      - deliveryx-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Main menu service routes
      - "traefik.http.routers.menu.rule=PathPrefix(`/api/v1/menus`) || PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/collections`) || PathPrefix(`/api/v1/attribute-groups`)"
      - "traefik.http.routers.menu.entrypoints=web"
      - "traefik.http.services.menu.loadbalancer.server.port=8082"
      - "traefik.http.routers.menu.priority=50"
      # Higher priority router for location-based menu/product endpoints
      - "traefik.http.routers.menu-locations.rule=PathPrefix(`/api/v1/locations/`) && (PathPrefix(`/api/v1/locations/{id}/menus`) || PathPrefix(`/api/v1/locations/{id}/products`))"
      - "traefik.http.routers.menu-locations.entrypoints=web"
      - "traefik.http.routers.menu-locations.service=menu"
      - "traefik.http.routers.menu-locations.priority=100"
    restart: unless-stopped

  # Approval Service
  approval-service:
    build:
      context: ./services/approval
      dockerfile: Dockerfile
    container_name: deliveryx-approval
    environment:
      DATABASE_URL: postgres://deliveryx:deliveryx_dev_pass@postgres:5432/deliveryx_approval?sslmode=disable
      MENU_SERVICE_URL: http://deliveryx-menu:8082
      PORT: 8083
      RABBITMQ_URL: amqp://deliveryx:deliveryx_dev_pass@rabbitmq:5672/
    ports:
      - "8083:8083"
    networks:
      - deliveryx-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      menu-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.approval.rule=PathPrefix(`/api/v1/approvals`)"
      - "traefik.http.routers.approval.entrypoints=web"
      - "traefik.http.services.approval.loadbalancer.server.port=8083"
    restart: unless-stopped

  # MinIO - S3-compatible object storage (for local development)
  minio:
    image: minio/minio:latest
    container_name: deliveryx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: deliveryx
      MINIO_ROOT_PASSWORD: deliveryx_dev_pass
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deliveryx-network

  # Media Service
  media-service:
    build:
      context: ./services/media
      dockerfile: Dockerfile
    container_name: deliveryx-media
    environment:
      PORT: 8084
      S3_REGION: us-east-1
      S3_BUCKET: deliveryx-media
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: deliveryx
      S3_SECRET_KEY: deliveryx_dev_pass
      S3_USE_PATH_STYLE: "true"
    ports:
      - "8084:8084"
    networks:
      - deliveryx-network
    depends_on:
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=PathPrefix(`/api/v1/media`)"
      - "traefik.http.routers.media.entrypoints=web"
      - "traefik.http.services.media.loadbalancer.server.port=8084"
    restart: unless-stopped

  # API Documentation Service
  api-docs:
    build:
      context: ./services/api-docs
      dockerfile: Dockerfile
    container_name: deliveryx-api-docs
    ports:
      - "8090:8090"
    networks:
      - deliveryx-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=PathPrefix(`/docs`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.http.services.docs.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.docs-stripprefix.stripprefix.prefixes=/docs"
      - "traefik.http.routers.docs.middlewares=docs-stripprefix"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

networks:
  deliveryx-network:
    driver: bridge
