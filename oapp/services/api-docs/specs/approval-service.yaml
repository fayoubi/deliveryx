openapi: 3.0.3
info:
  title: DeliveryX Approval Service API
  description: API for admin approval/rejection of submitted menus
  version: 1.0.0
  contact:
    name: DeliveryX API Support
    email: api@deliveryx.com

servers:
  - url: http://localhost/api/v1/approvals
    description: Local development (via Traefik)
  - url: http://localhost:8083/api/v1/approvals
    description: Direct service access

tags:
  - name: Approvals
    description: Menu approval operations

paths:
  /menus/{menu_id}/approve:
    post:
      tags:
        - Approvals
      summary: Approve a submitted menu
      description: Changes menu status to approved and logs the approval action
      operationId: approveMenu
      parameters:
        - name: menu_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Admin-Email
          in: header
          required: false
          schema:
            type: string
            format: email
          description: Admin email for audit trail
      responses:
        '200':
          description: Menu approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          description: Menu not in pending_review status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update menu status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /menus/{menu_id}/reject:
    post:
      tags:
        - Approvals
      summary: Reject a submitted menu
      description: Changes menu status to rejected with a reason and logs the rejection action
      operationId: rejectMenu
      parameters:
        - name: menu_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Admin-Email
          in: header
          required: false
          schema:
            type: string
            format: email
          description: Admin email for audit trail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectMenuRequest'
      responses:
        '200':
          description: Menu rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectionResponse'
        '400':
          description: Invalid request or menu not in pending_review status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update menu status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /menus/{menu_id}/history:
    get:
      tags:
        - Approvals
      summary: Get approval history for a menu
      description: Returns all approval/rejection actions for audit purposes
      operationId: getApprovalHistory
      parameters:
        - name: menu_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approval history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalLog'
        '500':
          description: Failed to retrieve history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ApprovalResponse:
      type: object
      properties:
        message:
          type: string
          example: "Menu approved successfully"
        menu_id:
          type: string
          format: uuid
        status:
          type: string
          example: "approved"

    RejectionResponse:
      type: object
      properties:
        message:
          type: string
          example: "Menu rejected successfully"
        menu_id:
          type: string
          format: uuid
        status:
          type: string
          example: "rejected"
        rejection_reason:
          type: string

    RejectMenuRequest:
      type: object
      required:
        - rejection_reason
      properties:
        rejection_reason:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Menu items missing descriptions"

    ApprovalLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        menu_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [approved, rejected]
        admin_id:
          type: string
          format: uuid
          nullable: true
        admin_email:
          type: string
          format: email
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
