openapi: 3.0.3
info:
  title: DeliveryX Restaurant Service API
  description: API for managing restaurant stores, locations, and operating hours
  version: 1.0.0
  contact:
    name: DeliveryX API Support
    email: api@deliveryx.com

servers:
  - url: http://localhost/api/v1
    description: Local development (via Traefik)
  - url: http://localhost:8081/api/v1
    description: Direct service access

tags:
  - name: Stores
    description: Store management operations
  - name: Locations
    description: Location management operations
  - name: Operating Hours
    description: Operating hours management

paths:
  /stores:
    get:
      tags:
        - Stores
      summary: List all stores
      operationId: listStores
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Sort field (prefix with - for descending)
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
        - name: q
          in: query
          description: Search stores by name (case-insensitive)
          schema:
            type: string
        - name: phone
          in: query
          description: Filter by exact phone number
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoresResponse'
        '400':
          description: Invalid pagination/sort/filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags:
        - Stores
      summary: Create a new store
      operationId: createStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /stores/{store_id}:
    get:
      tags:
        - Stores
      summary: Get store details
      operationId: getStore
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      tags:
        - Stores
      summary: Update store
      operationId: updateStore
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Store updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags:
        - Stores
      summary: Delete a store
      operationId: deleteStore
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Store deleted successfully
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Store cannot be deleted - has locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: "Store cannot be deleted while it has locations"
                code: "STORE_HAS_LOCATIONS"
                details:
                  locations_count: 3

  /stores/{store_id}/locations:
    get:
      tags:
        - Locations
      summary: List all locations for a store
      operationId: listLocations
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Sort field (prefix with - for descending)
          schema:
            type: string
            enum: [city, -city, created_at, -created_at]
            default: city
        - name: city
          in: query
          description: Filter by exact city name
          schema:
            type: string
        - name: q
          in: query
          description: Search locations by address (case-insensitive substring)
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationsResponse'
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid pagination/sort/filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags:
        - Locations
      summary: Create a location for a store
      operationId: createLocation
      parameters:
        - name: store_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Store not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /locations/{location_id}:
    get:
      tags:
        - Locations
      summary: Get location details
      operationId: getLocation
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Location details with operating hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationWithHours'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      tags:
        - Locations
      summary: Update location details
      operationId: updateLocation
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags:
        - Locations
      summary: Delete a location
      operationId: deleteLocation
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Location deleted successfully
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Location cannot be deleted - has menus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: "Location cannot be deleted while it has menus"
                code: "LOCATION_HAS_MENUS"
                details:
                  menus_count: 2
        '503':
          description: Menu service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /locations/{location_id}/operating-hours:
    put:
      tags:
        - Operating Hours
      summary: Set operating hours for a location
      operationId: setOperatingHours
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OperatingHoursRequest'
              minItems: 7
              maxItems: 7
      responses:
        '200':
          description: Operating hours updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatingHours'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    Store:
      type: object
      properties:
        store_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
          nullable: true
        logo_url:
          type: string
          nullable: true
        phone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStoreRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        logo_url:
          type: string
        phone:
          type: string

    UpdateStoreRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        logo_url:
          type: string
        phone:
          type: string

    Location:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        address:
          type: string
        city:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        location_manager:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LocationWithHours:
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          properties:
            operating_hours:
              type: array
              items:
                $ref: '#/components/schemas/OperatingHours'

    CreateLocationRequest:
      type: object
      required:
        - address
        - city
        - phone
      properties:
        address:
          type: string
        city:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        location_manager:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    OperatingHours:
      type: object
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        day_of_week:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        open_time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        close_time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "22:00"
        is_closed:
          type: boolean

    OperatingHoursRequest:
      type: object
      required:
        - day_of_week
        - is_closed
      properties:
        day_of_week:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        open_time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        close_time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "22:00"
        is_closed:
          type: boolean

    UpdateLocationRequest:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        phone:
          type: string
        location_manager:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    PaginatedStoresResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Store'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean

    PaginatedLocationsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean

    ApiError:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - STORE_HAS_LOCATIONS
            - LOCATION_HAS_MENUS
            - INTERNAL_ERROR
            - INVALID_REQUEST
            - SERVICE_UNAVAILABLE
        details:
          type: object
          additionalProperties: true
          description: Additional error details
